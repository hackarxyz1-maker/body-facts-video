name: Render Body Facts Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract Project
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip
          unzip body-facts-video.zip -d /tmp/bfv

      - name: Install Dependencies
        working-directory: /tmp/bfv/body-facts-video
        run: npm ci

      - name: Render HD Video
        working-directory: /tmp/bfv/body-facts-video
        run: |
          mkdir -p out
          npx remotion render src/index.jsx BodyFacts out/full_silent.mp4 --gl=swangle --concurrency=2 --image-format=jpeg --jpeg-quality=80 --crf=23

      - name: Add Voiceover
        working-directory: /tmp/bfv/body-facts-video
        run: |
          ffmpeg -y -i out/full_silent.mp4 -i voiceover.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest final.mp4

      - name: Upload Final MP4
        uses: actions/upload-artifact@v4
        with:
          name: Body-Facts-Final-HD
          path: /tmp/bfv/body-facts-video/final.mp4
          retention-days: 3
